name: "astrbot_plugin_pokedex"
display_name: "宝可梦图鉴"
short_desc: "本地中文宝可梦图鉴 + 能力值计算 + 对战模拟 + 队伍分析"
desc: "宝可梦图鉴插件：内置 pokemon-dataset-zh 中文图鉴库（1025 只宝可梦 + 295 个形态、特性、招式、道具、24 个地区图鉴、基准属性表），支持指令与 LLM 函数调用查询，图鉴结果以图片卡片展示。查询优先使用本地中文数据，PokéAPI 官方数据作为补充（可配置关闭，纯离线运行）。v0.2.0 新增能力值计算、双向属性相性、宝可梦对比、克制推荐、招式表/配招校验、回合制对战模拟、队伍分析与种族值筛选，全部本地数据离线可用。"
version: "v0.2.0"
author: "ca1e"
repo: ""
homepage: ""
license: "MIT"
tags:
  - "宝可梦"
  - "pokemon"
  - "图鉴"
  - "游戏"
astrbot_version: ">=4.0.0"
support_platforms:
  - "aiocqhttp"
  - "qq"
  - "qq_official"
  - "telegram"
  - "gewechat"
features:
  - "本地中文图鉴查询（编号/名称/形态名，精确匹配）"
  - "图片卡片展示（Pillow 渲染，无浏览器依赖）"
  - "LLM 函数调用工具（群聊 @机器人 自然语言查询）"
  - "属性相性查询（防守/进攻双向，本地基准属性表已与官方标准核对）"
  - "等级能力值计算（官方公式，含个体值与 25 种性格修正）"
  - "宝可梦对比与克制推荐（双向克制验证 + 种族值排序）"
  - "招式表查询/配招推荐/配招校验（升级招式含等级）"
  - "回合制对战模拟（简化规则，战报精简，同种子可复现）"
  - "队伍分析（共同弱点/全队抗性）与按种族值筛选"
  - "PokéAPI 官方数据补充（详情/相性，可配置关闭）"
keywords:
  - pokemon
  - 宝可梦
  - 图鉴
  - pokeapi
  - 对战模拟
